name: ai-identity

x-backend: &backend
  build:
    context: ./backend
    args:
      REQUIREMENTS: dev
  env_file: .env
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# Only backend and frontend publish host ports (configurable in .env).
# postgres, redis and seaweedfs are reachable only on the compose network.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible storage. S3 API on seaweedfs:8333 (internal only); no anonymous access.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - seaweedfs_data:/data

  # One-shot: waits for the S3 gateway, creates the private bucket, then exits.
  s3-init:
    image: amazon/aws-cli:2.37.5
    depends_on:
      - seaweedfs
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url "$$S3_ENDPOINT_URL" s3api head-bucket --bucket "$$S3_BUCKET_NAME" 2>/dev/null && exit 0
          aws --endpoint-url "$$S3_ENDPOINT_URL" s3api create-bucket --bucket "$$S3_BUCKET_NAME" && exit 0
          sleep 2
        done
        echo "S3 gateway not ready" >&2
        exit 1
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION_NAME}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  celery:
    <<: *backend
    command: celery -A config worker -l info

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  seaweedfs_data:
